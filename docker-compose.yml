# budu Telegram bot on a VPS (Hetzner, Oracle, etc.)
#
# Setup:
#   cp bot/.env.example bot/.env   # fill TELEGRAM_BOT_TOKEN, API_BASE_URL, …
#   docker compose up -d --build
#
# Playwright e2e (Postgres + Next.js) is a separate file:
#   docker compose --env-file /dev/null -f docker-compose.e2e.yml up --build -d --wait

services:
  budu-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: budu-bot:local
    container_name: budu-bot
    restart: unless-stopped
    env_file: bot/.env
    # Polling needs no inbound ports. Uncomment for local health checks:
    # ports:
    #   - "127.0.0.1:8080:8080"
